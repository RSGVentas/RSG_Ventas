<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSG Ventas</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f3f3;
  color: #333;
}

header {
  background: #198754;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p { margin: 8px 0 15px; }

.buscador {
  width: 95%;
  max-width: 600px;
  padding: 13px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

.categorias {
  background: white;
  padding: 15px;
  text-align: center;
}

.categorias button {
  border: none;
  background: #e9ecef;
  padding: 10px 14px;
  margin: 4px;
  border-radius: 20px;
  cursor: pointer;
}

.contenedor {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.titulo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 18px;
}

.producto {
  background: white;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  min-width: 0;
}

.producto img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  border-radius: 8px;
  background: #f8f8f8;
}

.producto h3 { margin: 10px 0 5px; }

.precio {
  font-size: 22px;
  font-weight: bold;
  color: #198754;
  margin: 8px 0;
}

.producto button {
  width: 100%;
  padding: 11px;
  background: #198754;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
}

.carrito {
  margin-top: 30px;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

.carrito button {
  background: #25D366;
  color: white;
  border: none;
  padding: 13px;
  border-radius: 7px;
  font-size: 16px;
  width: 100%;
  cursor: pointer;
}

.eliminar {
  width: auto !important;
  padding: 5px 10px !important;
  background: #dc3545 !important;
}

footer {
  margin-top: 30px;
  background: #198754;
  color: white;
  text-align: center;
  padding: 20px;
}

.mensaje {
  text-align: center;
  padding: 20px;
  background: white;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <h1>🛒 RSG Ventas</h1>
  <p>Productos y recuerdos</p>

  <input
    class="buscador"
    type="text"
    placeholder="¿Qué estás buscando?"
    id="buscador"
    oninput="aplicarFiltros()">
</header>

<div class="categorias">
  <button onclick="filtrar('Todos')">Todos</button>
  <button onclick="filtrar('Religiosos')">Religiosos</button>
  <button onclick="filtrar('Llaveros')">Llaveros</button>
  <button onclick="filtrar('Recuerdos')">Recuerdos</button>
</div>

<main class="contenedor">

  <div class="titulo">
    <h2>Productos destacados</h2>
    <span>🛒 <b id="cantidadCarrito">0</b></span>
  </div>

  <div id="estado" class="mensaje">
    Cargando productos...
  </div>

  <div class="productos" id="productos"></div>

  <section class="carrito">
    <h2>🛒 Mi carrito</h2>
    <div id="listaCarrito">
      <p>Tu carrito está vacío.</p>
    </div>
    <h3>Subtotal: $<span id="subtotal">0</span></h3>
    <h3>Cargo de servicio (20%): $<span id="cargo">0</span></h3>
    <h3>Total: $<span id="total">0</span></h3>

    <button onclick="enviarWhatsApp()">
      📲 Enviar pedido por WhatsApp
    </button>
  </section>

</main>

<footer>
  <p><b>RSG Ventas</b></p>
  <p>Productos y recuerdos</p>
</footer>

<script>
const URL_PRODUCTOS =
  "https://docs.google.com/spreadsheets/d/1SXuaPmMKJfNlAbgSqx5h6bRczkuJ_A1QjUQwAuR0tr0/export?format=csv&gid=0";

const TELEFONO_WHATSAPP = "543447520403";
const FORMATO_PRECIO = new Intl.NumberFormat("es-AR", {
  maximumFractionDigits: 2
});

let carrito = [];
let productosCargados = [];
let categoriaActual = "Todos";

function dinero(valor) {
  return FORMATO_PRECIO.format(valor);
}

// Lee correctamente los campos CSV que contienen comas entre comillas.
function leerCSV(texto) {
  const filas = [];
  let fila = [];
  let campo = "";
  let entreComillas = false;

  texto = texto.replace(/^\uFEFF/, "");

  for (let i = 0; i < texto.length; i++) {
    const caracter = texto[i];

    if (caracter === '"') {
      if (entreComillas && texto[i + 1] === '"') {
        campo += '"';
        i++;
      } else {
        entreComillas = !entreComillas;
      }
    } else if (caracter === "," && !entreComillas) {
      fila.push(campo);
      campo = "";
    } else if (
      (caracter === "\n" || caracter === "\r") &&
      !entreComillas
    ) {
      if (caracter === "\r" && texto[i + 1] === "\n") i++;
      fila.push(campo);

      if (fila.some(valor => valor.trim() !== "")) {
        filas.push(fila);
      }

      fila = [];
      campo = "";
    } else {
      campo += caracter;
    }
  }

  fila.push(campo);

  if (fila.some(valor => valor.trim() !== "")) {
    filas.push(fila);
  }

  return filas;
}

function detectarCategoria(nombre, categoriaHoja) {
  if (categoriaHoja) return categoriaHoja;

  const texto = nombre.toLowerCase();

  if (texto.includes("llavero")) return "Llaveros";
  if (
    texto.includes("medalla") ||
    texto.includes("rosario") ||
    texto.includes("cruz") ||
    texto.includes("religioso") ||
    texto.includes("papa")
  ) {
    return "Religiosos";
  }

  return "Recuerdos";
}

function convertirPrecio(valor) {
  let texto = String(valor || "").trim();
  texto = texto.replace(/[^\d,.-]/g, "");

  if (!texto) return NaN;

  // Admite precios argentinos como 7.000 y 7.000,50.
  if (texto.includes(",")) {
    texto = texto.replace(/\./g, "").replace(",", ".");
  } else if (/^-?\d{1,3}(\.\d{3})+$/.test(texto)) {
    texto = texto.replace(/\./g, "");
  }

  return Number(texto);
}

async function cargarProductosHoja() {
  const contenedor = document.getElementById("productos");
  const estado = document.getElementById("estado");

  estado.textContent = "Cargando productos...";
  contenedor.innerHTML = "";

  try {
    const respuesta = await fetch(URL_PRODUCTOS, {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("No se pudo acceder a Google Sheets.");
    }

    const textoCSV = await respuesta.text();
    const filas = leerCSV(textoCSV);

    if (filas.length < 2) {
      throw new Error("La hoja no contiene productos.");
    }

    const encabezados = filas.shift().map(valor =>
      valor.trim().toLowerCase().normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
    );

    const buscarColumna = (...nombres) =>
      encabezados.findIndex(nombre => nombres.includes(nombre));

    const iNombre = buscarColumna("nombre", "producto");
    const iPrecio = buscarColumna("precio");
    const iDescripcion = buscarColumna("descripcion");
    const iFoto = buscarColumna("foto", "fotos", "imagen");
    const iCategoria = buscarColumna("categoria", "categoría");

    if (iNombre < 0 || iPrecio < 0) {
      throw new Error(
        "La primera fila debe tener las columnas Nombre y Precio."
      );
    }

    productosCargados = filas.map(columnas => {
      const nombre = (columnas[iNombre] || "").trim();
      const precio = convertirPrecio(columnas[iPrecio]);

      return {
        nombre,
        precio,
        descripcion: iDescripcion >= 0
          ? (columnas[iDescripcion] || "").trim()
          : "",
        foto: iFoto >= 0
          ? (columnas[iFoto] || "").trim()
          : "",
        categoria: detectarCategoria(
          nombre,
          iCategoria >= 0
            ? (columnas[iCategoria] || "").trim()
            : ""
        )
      };
    }).filter(producto =>
      producto.nombre &&
      Number.isFinite(producto.precio) &&
      producto.precio >= 0
    );

    if (productosCargados.length === 0) {
      throw new Error("No se encontraron productos válidos.");
    }

    estado.style.display = "none";
    aplicarFiltros();

  } catch (error) {
    console.error("Error al cargar productos:", error);
    estado.style.display = "block";
    estado.textContent =
      "No se pudieron cargar los productos. Revisá que la hoja de Google permita leer el CSV y que tenga las columnas Nombre y Precio.";
  }
}

function mostrarProductos(lista) {
  const contenedor = document.getElementById("productos");
  contenedor.innerHTML = "";

  if (lista.length === 0) {
    contenedor.innerHTML =
      '<p class="mensaje">No se encontraron productos.</p>';
    return;
  }

  lista.forEach(producto => {
    const tarjeta = document.createElement("div");
    tarjeta.className = "producto";

    const nombre = document.createElement("h3");
    nombre.textContent = producto.nombre;
    tarjeta.appendChild(nombre);

    if (producto.foto) {
      const imagen = document.createElement("img");
      imagen.alt = producto.nombre;
      imagen.loading = "lazy";
      imagen.src = producto.foto;

      imagen.onerror = function() {
        this.style.display = "none";
      };

      tarjeta.insertBefore(imagen, nombre);
    }

    const descripcion = document.createElement("p");
    descripcion.textContent =
      producto.descripcion || "Producto y recuerdo especial";
    tarjeta.appendChild(descripcion);

    const precio = document.createElement("div");
    precio.className = "precio";
    precio.textContent = "$" + dinero(producto.precio);
    tarjeta.appendChild(precio);

    const boton = document.createElement("button");
    boton.textContent = "Agregar al carrito";
    boton.addEventListener("click", () => {
      agregarCarrito(producto.nombre, producto.precio);
    });
    tarjeta.appendChild(boton);

    contenedor.appendChild(tarjeta);
  });
}

function aplicarFiltros() {
  const texto = document.getElementById("buscador")
    .value.trim().toLowerCase();

  const lista = productosCargados.filter(producto => {
    const coincideCategoria =
      categoriaActual === "Todos" ||
      producto.categoria.toLowerCase() ===
        categoriaActual.toLowerCase();

    const coincideTexto =
      producto.nombre.toLowerCase().includes(texto) ||
      producto.descripcion.toLowerCase().includes(texto);

    return coincideCategoria && coincideTexto;
  });

  mostrarProductos(lista);
}

function filtrar(categoria) {
  categoriaActual = categoria;
  aplicarFiltros();
}

function agregarCarrito(nombre, precio) {
  carrito.push({ nombre, precio });
  actualizarCarrito();
}

function eliminarProducto(indice) {
  carrito.splice(indice, 1);
  actualizarCarrito();
}

function actualizarCarrito() {
  const lista = document.getElementById("listaCarrito");
  let subtotal = 0;

  lista.innerHTML = "";

  if (carrito.length === 0) {
    lista.innerHTML = "<p>Tu carrito está vacío.</p>";
  }

  carrito.forEach((producto, indice) => {
    subtotal += producto.precio;

    const item = document.createElement("p");
    item.appendChild(document.createTextNode(
      producto.nombre + " - $" + dinero(producto.precio) + " "
    ));

    const boton = document.createElement("button");
    boton.className = "eliminar";
    boton.textContent = "❌";
    boton.setAttribute("aria-label", "Eliminar " + producto.nombre);
    boton.addEventListener("click", () => eliminarProducto(indice));

    item.appendChild(boton);
    lista.appendChild(item);
  });

  const cargo = subtotal * 0.20;
  const total = subtotal + cargo;

  document.getElementById("subtotal").textContent = dinero(subtotal);
  document.getElementById("cargo").textContent = dinero(cargo);
  document.getElementById("total").textContent = dinero(total);
  document.getElementById("cantidadCarrito").textContent = carrito.length;
}

function enviarWhatsApp() {
  if (carrito.length === 0) {
    alert("El carrito está vacío.");
    return;
  }

  let subtotal = 0;
  let mensaje = "Hola, quiero realizar este pedido en RSG Ventas:\n\n";

  carrito.forEach(producto => {
    mensaje += "• " + producto.nombre +
      " - $" + dinero(producto.precio) + "\n";
    subtotal += producto.precio;
  });

  const cargo = subtotal * 0.20;
  const total = subtotal + cargo;

  mensaje += "\nSubtotal: $" + dinero(subtotal);
  mensaje += "\nCargo de servicio (20%): $" + dinero(cargo);
  mensaje += "\nTotal: $" + dinero(total);

  const url = "https://wa.me/" + TELEFONO_WHATSAPP +
    "?text=" + encodeURIComponent(mensaje);

  window.open(url, "_blank");
}

cargarProductosHoja();
</script>

</body>
</html>
