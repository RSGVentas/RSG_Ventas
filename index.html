<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSG Ventas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f0;
      color: #222;
    }

    header {
      background: #168447;
      color: white;
      text-align: center;
      padding: 22px 12px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .buscador {
      display: block;
      width: 92%;
      max-width: 500px;
      margin: 18px auto;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    .filtros {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 10px 15px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 15px;
    }

    .filtros button {
      background: #e8b52b;
      color: #222;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 14px;
      padding: 12px;
      max-width: 1000px;
      margin: auto;
    }

    .producto {
      background: white;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 7px #00000018;
    }

    .producto img {
      width: 100%;
      height: 170px;
      object-fit: contain;
      border-radius: 7px;
    }

    .producto h3 {
      font-size: 17px;
      margin: 10px 0;
    }

    .precio {
      font-size: 19px;
      font-weight: bold;
      color: #168447;
      margin: 10px 0;
    }

    .boton-agregar {
      background: #168447;
      color: white;
      width: 100%;
    }

    .carrito {
      background: white;
      max-width: 700px;
      margin: 24px auto;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 7px #00000018;
    }

    .carrito h2 {
      color: #168447;
      margin-top: 0;
    }

    .item-carrito {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .item-carrito span {
      overflow-wrap: anywhere;
    }

    .boton-eliminar {
      background: #c62828;
      color: white;
      padding: 7px 10px;
    }

    .resumen {
      margin-top: 16px;
      line-height: 1.8;
    }

    .total {
      font-size: 21px;
      font-weight: bold;
      color: #168447;
    }

    .boton-whatsapp {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: #20b85a;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .aviso {
      color: #666;
      font-size: 13px;
    }

    .mensaje-carga {
      text-align: center;
      padding: 20px;
      color: #555;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #168447;
      color: white;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 RSG Ventas</h1>
    <p>Productos y recuerdos</p>
  </header>

  <input
    class="buscador"
    id="buscador"
    type="search"
    placeholder="¿Qué estás buscando?"
    oninput="aplicarFiltros()"
  >

  <div class="filtros">
    <button onclick="mostrarTodos()">Todos</button>
    <button onclick="filtrar('Religiosos')">Religiosos</button>
    <button onclick="filtrar('Llaveros')">Llaveros</button>
    <button onclick="filtrar('Recuerdos')">Recuerdos</button>
  </div>

  <!-- Los productos se cargan desde Google Sheets -->
  <main class="productos" id="productos">
    <p class="mensaje-carga">Cargando productos...</p>
  </main>

  <section class="carrito" id="carrito">

    <h2>🛒 Tu carrito</h2>

    <p id="carritoVacio">
      Todavía no agregaste productos.
    </p>

    <div id="listaCarrito"></div>

    <div class="resumen">

      <div>
        Productos:
        <strong id="cantidadCarrito">0</strong>
      </div>

      <div>
        Subtotal:
        <strong id="subtotal">$0</strong>
      </div>

      <div>
        Cargo de servicio (10%):
        <strong id="cargo">$0</strong>
      </div>

      <div class="total">
        Total:
        <span id="total">$0</span>
      </div>

    </div>

    <p class="aviso">
      El cargo de servicio se calcula sobre el subtotal de los productos.
    </p>

    <button
      class="boton-whatsapp"
      onclick="enviarWhatsApp()"
    >
      📲 Enviar pedido por WhatsApp
    </button>

  </section>

  <footer>
    <p>RSG Ventas</p>
    <p>Gracias por elegirnos</p>
  </footer>

  <script>

    // DIRECCIÓN DE GOOGLE SHEETS / APPS SCRIPT

    const URL_PRODUCTOS =
      "https://script.google.com/macros/s/AKfycbzYqUry0JmUIznVVlyBz6SjfUNV9AnPixm6m3gYstyPTnqrlbLnJYQ_mAkuhmPaS3c4/exec";


    // CONFIGURACIÓN DEL CARRITO

    let carrito = [];

    const PORCENTAJE_SERVICIO = 0.10;

    let categoriaActiva = "";


    // FORMATO DE PRECIOS

    function formatoPrecio(numero) {
      return "$" + numero.toLocaleString("es-AR");
    }


    // AGREGAR PRODUCTO AL CARRITO

    function agregarCarrito(nombre, precio) {

      carrito.push({
        nombre: nombre,
        precio: precio
      });

      actualizarCarrito();

      document.getElementById("carrito").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    // ELIMINAR PRODUCTO

    function eliminarProducto(indice) {

      carrito.splice(indice, 1);

      actualizarCarrito();

    }


    // ACTUALIZAR CARRITO

      const lista = document.getElementById("listaCarrito");

      const carritoVacio = document.getElementById("carritoVacio");

      lista.replaceChildren();

        subtotal += producto.precio;

        fila.className = "item-carrito";

        const detalle = document.createElement("span");
