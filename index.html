<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSG Ventas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f0;
      color: #222;
    }

    header {
      background: #168447;
      color: white;
      text-align: center;
      padding: 22px 12px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .buscador {
      display: block;
      width: 92%;
      max-width: 500px;
      margin: 18px auto;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    .filtros {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 10px 15px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 15px;
    }

    .filtros button {
      background: #e8b52b;
      color: #222;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 14px;
      padding: 12px;
      max-width: 1000px;
      margin: auto;
    }

    .producto {
      background: white;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 7px #00000018;
    }

    .producto img {
      width: 100%;
      height: 170px;
      object-fit: contain;
      border-radius: 7px;
    }

    .sin-foto {
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f7f0;
      border-radius: 7px;
      color: #777;
      font-size: 14px;
    }

    .producto h3 {
      font-size: 17px;
      margin: 10px 0;
    }

    .descripcion {
      font-size: 14px;
      color: #666;
    }

    .precio {
      font-size: 19px;
      font-weight: bold;
      color: #168447;
      margin: 10px 0;
    }

    .boton-agregar {
      background: #168447;
      color: white;
      width: 100%;
    }

    .carrito {
      background: white;
      max-width: 700px;
      margin: 24px auto;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 7px #00000018;
    }

    .carrito h2 {
      color: #168447;
      margin-top: 0;
    }

    .item-carrito {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .item-carrito span {
      overflow-wrap: anywhere;
    }

    .boton-eliminar {
      background: #c62828;
      color: white;
      padding: 7px 10px;
    }

    .resumen {
      margin-top: 16px;
      line-height: 1.8;
    }

    .total {
      font-size: 21px;
      font-weight: bold;
      color: #168447;
    }

    .boton-whatsapp {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: #20b85a;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .aviso {
      color: #666;
      font-size: 13px;
    }

    .mensaje-carga {
      text-align: center;
      padding: 20px;
      color: #555;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #168447;
      color: white;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 RSG Ventas</h1>
    <p>Productos y recuerdos</p>
  </header>

  <input
    class="buscador"
    id="buscador"
    type="search"
    placeholder="¿Qué estás buscando?"
    oninput="aplicarFiltros()"
  >

  <div class="filtros">
    <button onclick="mostrarTodos()">Todos</button>
    <button onclick="filtrar('Religiosos')">Religiosos</button>
    <button onclick="filtrar('Llaveros')">Llaveros</button>
    <button onclick="filtrar('Recuerdos')">Recuerdos</button>
  </div>

  <main class="productos" id="productos">
    <p class="mensaje-carga">Cargando productos...</p>
  </main>

  <section class="carrito" id="carrito">

    <h2>🛒 Tu carrito</h2>

    <p id="carritoVacio">
      Todavía no agregaste productos.
    </p>

    <div id="listaCarrito"></div>

    <div class="resumen">

      <div>
        Productos:
        <strong id="cantidadCarrito">0</strong>
      </div>

      <div>
        Subtotal:
        <strong id="subtotal">$0</strong>
      </div>

      <div>
        Cargo de servicio (10%):
        <strong id="cargo">$0</strong>
      </div>

      <div class="total">
        Total:
        <span id="total">$0</span>
      </div>

    </div>

    <p class="aviso">
      El cargo de servicio se calcula sobre el subtotal de los productos.
    </p>

    <button
      class="boton-whatsapp"
      onclick="enviarWhatsApp()"
    >
      📲 Enviar pedido por WhatsApp
    </button>

  </section>

  <footer>
    <p>RSG Ventas</p>
    <p>Gracias por elegirnos</p>
  </footer>

  <script>

    // CONEXIÓN CON GOOGLE SHEETS

    
    
const URL_PRODUCTOS = 
https://script.google.com/macros/s/AKfycbzYqUry0JmUIznVVlyBz6SjfUNV9AnPixm6m3gYstyPTnqrlbLnJYQ_mAkuhmPaS3c4/exec
    // CONFIGURACIÓN DE WHATSAPP
    // Colocar el número con código de país y área,
    // sin espacios, sin + y sin guiones.

    const NUMERO_WHATSAPP = "";


    // CONFIGURACIÓN DEL CARRITO

    let carrito = [];
    let productosDisponibles = [];
    let categoriaActiva = "";

    const PORCENTAJE_SERVICIO = 0.10;


    // FORMATO DE PRECIOS

    function formatoPrecio(numero) {
      return "$" + Number(numero).toLocaleString("es-AR", {
        maximumFractionDigits: 2
      });
    }


    // CONVERTIR PRECIO A NÚMERO

    function convertirPrecio(valor) {

      if (typeof valor === "number") {
        return valor;
      }

      let texto = String(valor || "")
        .replace(/[^\d,.-]/g, "")
        .trim();

      if (texto.includes(",")) {
        texto = texto
          .replace(/\./g, "")
          .replace(",", ".");
      }

      const numero = Number(texto);

      return Number.isFinite(numero) ? numero : 0;
    }


    // OBTENER CATEGORÍA

    function obtenerCategoria(producto) {

      const categoria = String(
        producto.categoria || producto.Categoria || ""
      ).toLowerCase();

      if (categoria) {
        return categoria;
      }

      const texto = (
        String(producto.nombre || "") + " " +
        String(producto.descripcion || "")
      ).toLowerCase();

      if (texto.includes("llavero")) {
        return "llaveros";
      }

      if (
        texto.includes("medalla") ||
        texto.includes("rosario") ||
        texto.includes("papa") ||
        texto.includes("estampita") ||
        texto.includes("relig")
      ) {
        return "religiosos";
      }

      return "recuerdos";
    }


    // NORMALIZAR PRODUCTOS

    function normalizarProducto(producto) {

      const nombre =
        producto.nombre ||
        producto.Nombre ||
        producto.producto ||
        producto.Producto ||
        "";

      const precio = convertirPrecio(
        producto.precio ||
        producto.Precio ||
        0
      );

      const descripcion =
        producto.descripcion ||
        producto.Descripcion ||
        producto.descripción ||
        "";

      const foto =
        producto.foto ||
        producto.Foto ||
        producto.imagen ||
        producto.Imagen ||
        "";

      return {
        nombre: String(nombre),
        precio: precio,
        descripcion: String(descripcion),
        foto: String(foto),
        categoria: obtenerCategoria(producto)
      };
    }


    // CARGAR PRODUCTOS DESDE GOOGLE SHEETS

    async function cargarProductos() {

      const contenedor = document.getElementById("productos");

      try {

        const respuesta = await fetch(URL_PRODUCTOS, {
          method: "GET",
          cache: "no-store"
        });

        if (!respuesta.ok) {
          throw new Error("No se pudo conectar con Google Sheets.");
        }

        const datos = await respuesta.json();

        let lista = [];

        if (Array.isArray(datos)) {
          lista = datos;
        } else if (datos && Array.isArray(datos.productos)) {
          lista = datos.productos;
        } else if (datos && Array.isArray(datos.data)) {
          lista = datos.data;
        } else if (datos && Array.isArray(datos.rows)) {
          lista = datos.rows;
        } else {
          throw new Error("El formato de productos recibido no es válido.");
        }

        productosDisponibles = lista
          .map(normalizarProducto)
          .filter(producto => producto.nombre && producto.precio > 0);

        if (productosDisponibles.length === 0) {
          contenedor.innerHTML =
            '<p class="mensaje-carga">Todavía no hay productos disponibles.</p>';
          return;
        }

        aplicarFiltros();

      } catch (error) {

        console.error("Error al cargar productos:", error);

        contenedor.innerHTML =
          '<p class="mensaje-carga">No se pudieron cargar los productos. Revisar la conexión con Google Sheets.</p>';

      }

    }


   function mostrarProductos(lista) {

  const contenedor = document.getElementById("productos");

  contenedor.replaceChildren();

  if (lista.length === 0) {
    const mensaje = document.createElement("p");
    mensaje.className = "mensaje-carga";
    mensaje.textContent = "No se encontraron productos.";
    contenedor.appendChild(mensaje);
    return;
  }

  lista.forEach(function(producto) {

    const tarjeta = document.createElement("article");
    tarjeta.className = "producto";

    if (producto.foto && producto.foto.trim() !== "") {

      const imagen = document.createElement("img");

      let enlaceFoto = producto.foto.trim();

      if (enlaceFoto.includes("drive.google.com/file/d/")) {
        const idFoto = enlaceFoto.split("/d/")[1].split("/")[0];
        enlaceFoto = "https://drive.google.com/uc?export=view&id=" + idFoto;
      }

      imagen.src = enlaceFoto;
      imagen.alt = producto.nombre;

      imagen.onerror = function() {
        const reemplazo = document.createElement("div");
        reemplazo.className = "sin-foto";
        reemplazo.textContent = "Imagen no disponible";
        imagen.replaceWith(reemplazo);
      };

      tarjeta.appendChild(imagen);

    } else {

      const sinFoto = document.createElement("div");
      sinFoto.className = "sin-foto";
      sinFoto.textContent = "Sin fotografía";
      tarjeta.appendChild(sinFoto);

    }

    const titulo = document.createElement("h3");
    titulo.textContent = producto.nombre;
    tarjeta.appendChild(titulo);

    if (producto.descripcion) {
      const descripcion = document.createElement("p");
      descripcion.className = "descripcion";
      descripcion.textContent = producto.descripcion;
      tarjeta.appendChild(descripcion);
    }

    const precio = document.createElement("div");
    precio.className = "precio";
    precio.textContent = formatoPrecio(producto.precio);
    tarjeta.appendChild(precio);

    const boton = document.createElement("button");
    boton.className = "boton-agregar";
    boton.textContent = "Agregar al carrito";

    boton.addEventListener("click", function() {
      agregarCarrito(producto.nombre, producto.precio);
    });

    tarjeta.appendChild(boton);
    contenedor.appendChild(tarjeta);

  });
}
